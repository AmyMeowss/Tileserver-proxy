<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tile Demo</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9/dist/leaflet.css"
  />

  <style>
    html,
    body,
    #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9/dist/leaflet.js"></script>

  <script>
    const map = L.map("map").setView([52.5, 6.6], 8);

    L.tileLayer("/tiles/{z}/{x}/{y}.png", {
      maxZoom: 19,
      minZoom: 0,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);
  </script>
</body>
</html>
